template:
    id: warmedupsetup
    name: warmed-up-setup
    step:
        run:
            container:
                connector: account.har_connector
                image: harness0.harness.io/oci/devx-images/ci-tools:v1.0.4
            script: |-
                set -e

                function handle_error() {
                  local error_code=$?
                  local error_line=$BASH_LINENO
                  local error_command=$BASH_COMMAND

                  # Log the error details
                  echo "Error occurred on line $error_line: command=$error_command (exit code: $error_code)"
                  # reset to develop if there is an error
                   exit 1
                }

                trap handle_error ERR
                podName=<+steps.pre.output.outputVariables.podName>
                echo "${podName}"


                ghprbTargetBranch=<+trigger.targetBranch>
                echo "TARGET BRANCH = $ghprbTargetBranch"
                ghprbSourceBranch=<+trigger.sourceBranch>
                echo "SOURCE BRANCH = $ghprbSourceBranch"

                COMMIT_SHA="<+pipeline.stages.Setup.steps.RUN_Variables.output.outputVariables.SOURCE_SHA>"
                BASE_COMMIT_SHA="<+pipeline.stages.Setup.steps.RUN_Variables.output.outputVariables.TARGET_SHA>"

                HC_USER="<+pipeline.variables.HC_USER>"
                export HC_USER=$(echo "$HC_USER" | sed 's/@.*//')
                export HC_TOKEN="<+pipeline.variables.HC_TOKEN>"

                export REPO_URL="https://git0.harness.io/l7B_kbSEQD2wjrM7PShm5w/PROD/Harness_Commons/harness-core.git"

                export FULL_GIT_CLONE="$(echo ${REPO_URL} | sed -E 's#(http[s]?://)(.+)#\1'${HC_USER}':'${HC_TOKEN}'@\2#g')"
                HARNESS_PL_ENGG_URL="https://${HC_USER}:${HC_TOKEN}@git0.harness.io/l7B_kbSEQD2wjrM7PShm5w/PROD/Harness_Commons/harness-pl-engg.git"

                echo "Initialising harness-pl-engg submodule"
                kubectl exec --stdin ${podName} -n $NAMESPACE -- sh -c "git config --global credential.helper store && echo '$HARNESS_PL_ENGG_URL' > /root/.git-credentials && cd /opt/harness/harness-core && ./tools/bazel/make/get_submodule.sh"

                echo "Pre processing for checks, SHAs: COMMIT_SHA=$COMMIT_SHA BASE_COMMIT_SHA=$BASE_COMMIT_SHA, HC_USER=$HC_USER"
                kubectl exec --stdin ${podName} -n $NAMESPACE -- sh -c "cd /opt/harness/harness-core && git fetch origin develop"
                kubectl exec --stdin ${podName} -n $NAMESPACE -- sh -c "export ghprbSourceBranch=$ghprbSourceBranch && export ghprbTargetBranch=$ghprbTargetBranch && export COMMIT_SHA=$COMMIT_SHA && export BASE_COMMIT_SHA=$BASE_COMMIT_SHA && export FULL_GIT_CLONE=$FULL_GIT_CLONE && cd /opt/harness/harness-core && ./tools/harness-pl-engg/warmedup-bazel/bazelContainer/scripts/pre_requisite.sh"

                #kubectl exec --stdin ${podName} -n $NAMESPACE -- sh -c "kubectl label --overwrite pods ${podName} isAvailable=false && export ghprbSourceBranch=$ghprbSourceBranch && export ghprbTargetBranch=$ghprbTargetBranch && export COMMIT_SHA=$COMMIT_SHA && export BASE_COMMIT_SHA=$BASE_COMMIT_SHA && cd /opt/harness/harness-core && . tools/bazel/bazelContainer/scripts/pre_requisite.sh"
            shell: bash
    tags: {}
    version: submodule
