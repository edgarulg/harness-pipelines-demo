pipeline:
    clone:
        enabled: true
        repo: harness-core
        depth: 0
    id: TIAll_v1
    inputs:
        ACCOUNT_ID:
            default: l7B_kbSEQD2wjrM7PShm5w
            description: required by the checkIfAllRequired step
            type: string
        COMMENT:
            default: <+trigger.payload.comment.text>
            type: string
        DOCKERHUB_PASSWORD:
            default: org.DOCKER_HARNESSCIE
            description: Docker Hub password/token for authenticated pulls
            mask: true
            type: secret
        DOCKERHUB_USERNAME:
            default: harnesscie
            description: Docker Hub username for authenticated pulls
            type: string
        GH_TOKEN:
            default: org.githubbotharnesstoken
            mask: true
            type: secret
        HARNESS_CORE_URL:
            default: https://harness0.harness.io/gateway/code/api/v1/repos/l7B_kbSEQD2wjrM7PShm5w/PROD/Harness_Commons/harness-core
            description: required by setup template
            type: string
        HC_TOKEN:
            default: account.bot_harness_account_token
            description: used by setup template
            mask: true
            type: secret
        HC_USER:
            default: bot
            description: used by setup step
            type: string
        JDK_IMAGE:
            default: harness0.harness.io/oci/devx-images/java-go-cie-agent:java-17.0.7_7
            type: string
        NAMESPACE:
            default: warmedup-bazel
            description: 'needed for k8s infra setup '
            type: string
        PRNUMBER:
            default: <+trigger.payload.pull_req.number>
            type: string
        SHA:
            default: <+trigger.payload.sha>
            type: string
        Webhook:
            default: org.tiMasterFailureAlertsSlackWH
            mask: true
            type: secret
        X_Harness_Token:
            default: X_Harness_Token
            mask: true
            type: secret
        hc_token:
            default: HarnessCodeToken
            mask: true
            type: secret
        jira_api_token:
            default: jira-monitor-token
            mask: true
            type: secret
        run:
            default: "false"
            enum:
                - "false"
                - "true"
            type: string
        sa_token:
            default: bot-harness-token
            mask: true
            type: secret
        sa_username:
            default: bot-harness-username
            mask: true
            type: secret
    name: unitTests
    stages:
        - build-intelligence:
            enabled: false
          cache:
            enabled: false
            paths: []
          clone:
            enabled: true
          env:
            ACCOUNT_KEY: <+stage.variables.ACCOUNT_KEY>
            HC_TOKEN: <+stage.variables.HC_TOKEN>
            NAMESPACE: <+stage.variables.NAMESPACE>
          id: statefulRunner
          inputs:
            ACCOUNT_KEY:
                mask: true
                type: secret
                value: bot_harness_hc_sync_token
            HC_TOKEN:
                mask: true
                type: secret
                value: account.bot_harness_account_token
            NAMESPACE:
                type: string
                value: warmedup-bazel
          name: statefulRunner
          platform:
            arch: amd64
            os: linux
          runtime:
            kubernetes:
                automount-service-token: true
                connector: org.warmeduparmcommon
                namespace: warmedup-bazel
                node-selector:
                    size: small
                service-account: warmedup-bazel-sa
                tolerations:
                    - effect: NoSchedule
                      key: pipeline
                      operator: Equal
                      value: warmedup-ci
          steps:
            - id: pre
              name: pre
              template:
                uses: org.warmedupprereq_08ec@1.1-arm
                with:
                    overlay:
                        step:
                            run:
                                container:
                                    connector: account.har_connector
                                    image: harness0.harness.io/oci/devx-images/ci-tools:v1.0.4
                                env:
                                    NAMESPACE: <+pipeline.variables.NAMESPACE>
                                    TYPE: bazel-uts-arm-c4a-high
                                    slackWH: <+pipeline.variables.Webhook>
            - id: setup
              name: setup
              template:
                uses: warmedupsetup_4617@submodule
                with:
                    overlay:
                        step:
                            run:
                                container:
                                    connector: account.har_connector
                                    image: harness0.harness.io/oci/devx-images/ci-tools:v1.0.4
            - id: test
              name: runTests
              timeout: 3h
              run-test:
                container:
                    connector: account.har_connector
                    image: harness0.harness.io/oci/devx-images/ci-tools:v1.0.4
                    resources:
                        limits:
                            cpu: 1000m
                            memory: 3GiB
                env:
                    BUILD_PURPOSE: PR_CHECK
                    DOCKERHUB_PASSWORD: <+pipeline.variables.DOCKERHUB_PASSWORD>
                    DOCKERHUB_USERNAME: <+pipeline.variables.DOCKERHUB_USERNAME>
                intelligence:
                    disabled: false
                output:
                    - alias: TI_FILTER_FILE_PATH
                      name: TI_FILTER_FILE_PATH
                    - alias: FLAG
                      name: FLAG
                    - alias: TIALL
                      name: TIALL
                report:
                    paths:
                        - /harness/testlogs/**/test.xml
                    type: junit
                script: "#!/bin/bash\n\n# Define colors\nGREEN='\\033[0;32m'\nYELLOW='\\033[1;33m'\nRED='\\033[0;31m'\nNC='\\033[0m' # No Color\n\n# Initial commands\npwd\necho \"$HOME\"\n\nCOMMENT=\"<+pipeline.variables.COMMENT>\"\n\nTIALL='false'\nFLAG='false'\nif echo \"$COMMENT\" | grep -qE '^.*trigger.*[, -](ut([0-9]|1[0-5])|cvngTests)($|[, ].*)'; then\n    echo \"Comment matches the regex, setting TIALL to false\"\n    TIALL='false'\n    FLAG='true'\nelif [ ! -f \"$TI_FILTER_FILE_PATH\" ]; then\n    echo \"IGNORING THIS EXECUTION, ALL TESTS WERE PICKED UP BY TI\"\n    TIALL='true'\nelif grep -qE \"software\\.wings\\.licensing|software\\.wings\\.scheduler\\.account|software\\.wings\\.service\\.delegate|software\\.wings\\.helpers\\.ext\\.jenkins|software\\.wings\\.service\\.AppdynamicsTest\" \"$TI_FILTER_FILE_PATH\"; then\n    echo \"Found specific tests (licensing, scheduler account, or delegate tests) in filter file\"\n    TIALL='true'\nfi\n\necho \"TI_FILTER_FILE_PATH $TI_FILTER_FILE_PATH\" >> /addon/tmp/test.out\necho \"TIALL $TIALL\" >> /addon/tmp/test.out\necho \"FLAG $FLAG\" >> /addon/tmp/test.out\n\n# Define pod name\nPOD_NAME=\"<+steps.pre.output.outputVariables.podName>\"\nexport TI_FILTER_FILE_PATH=$TI_FILTER_FILE_PATH\n# Check if filter file exists \nif [ ! -f \"$TI_FILTER_FILE_PATH\" ]; then\n    echo -e \"${YELLOW}IGNORING THIS EXECUTION, ALL TESTS WERE PICKED UP BY TI${NC}\"\n    echo -e \"${YELLOW}The TI had picked up ALL tests${NC}\"\n    exit 0\nelif [ ! -s \"$TI_FILTER_FILE_PATH\" ]; then\n    echo -e \"${YELLOW}Filter file exists but is empty. No tests were selected to run.${NC}\"\n    echo -e \"${YELLOW}The TI had picked up 0 tests${NC}\"\n    exit 0\nfi\n\n# Check if specific tests are present in the filter file\nif grep -qE \"software\\.wings\\.licensing|software\\.wings\\.scheduler\\.account|software\\.wings\\.service\\.delegate|software\\.wings\\.helpers\\.ext\\.jenkins|software\\.wings\\.service\\.AppdynamicsTest\" \"$TI_FILTER_FILE_PATH\"; then\n    echo -e \"${YELLOW}Found specific tests (licensing, scheduler account,jenkins, or delegate tests) in filter file${NC}\"\n    echo -e \"${YELLOW}Exiting successfully as requested${NC}\"\n    exit 0\nfi\n\n# Display config files\necho \"Filter file generated by TI:\"\ncat $TI_FILTER_FILE_PATH\n\n# Setup pod directories\nkubectl exec $POD_NAME -- /bin/sh -c \"\n    mkdir -p \\\n        /addon/tmp/ti/v2/filter/ \\\n        /addon/tmp/ti/v2/config/ \\\n        /addon/bin/v2/java \\\n        /addon/tmp/ti/v2/callgraph/cg/ \\\n        /opt/harness/harness-core/testlogs\n\"\n\n# Copy necessary files to the pod\nkubectl cp $TI_FILTER_FILE_PATH $POD_NAME:/addon/tmp/ti/v2/filter/filter_0\nkubectl cp $TI_DOTNET_CONFIG $POD_NAME:/addon/tmp/ti/v2/config/config_0.ini\n\n# Execute commands inside the pod\nkubectl exec $POD_NAME -- /bin/sh -c \"\n    echo \\\"${DOCKERHUB_PASSWORD}\\\" | docker login -u \\\"${DOCKERHUB_USERNAME}\\\" --password-stdin\n    curl https://storage.googleapis.com/harness-ti/java/java-agent.jar > /addon/bin/v2/java/java-agent-v2.jar\n    export JAVA_TOOL_OPTIONS=-javaagent:/addon/bin/v2/java/java-agent-v2.jar=/addon/tmp/ti/v2/config/config_0.ini\n    export TI_V2=1\n    export TI=1\n    export TI_OUTPUT_PATH=/addon/tmp/ti/v2/callgraph/cg/\n    export TI_FILTER_FILE_PATH=/addon/tmp/ti/v2/filter/filter_0\n    export RUN_FROM=pipeline\n    cd /opt/harness/harness-core\n    make test\n    echo \\$? > /tmp/test_exit_code\n\n    if [ -d \\\"/opt/harness/.bazel_runner/output_base/execroot/harness_monorepo/bazel-out/aarch64-fastbuild/testlogs\\\" ]; then\n        echo -e '${GREEN}Looking for test files in bazel output directory${NC}'\n        find /opt/harness/.bazel_runner/output_base/execroot/harness_monorepo/bazel-out/aarch64-fastbuild/testlogs -name test.xml | cpio -pmd testlogs 2>/dev/null || true\n\n        rm -rf /opt/harness/.bazel_runner/output_base/execroot/harness_monorepo/bazel-out/aarch64-fastbuild/testlogs || true\n    else\n        echo -e '${YELLOW}Bazel output directory does not exist - this is expected if filter file was empty${NC}'\n        touch /opt/harness/harness-core/testlogs/.placeholder\n    fi\n\n\"\n\nTEST_EXIT_CODE=$(kubectl exec $POD_NAME -- cat /tmp/test_exit_code || echo 0)\n\nmkdir -p testlogs\nkubectl cp $POD_NAME:/opt/harness/harness-core/testlogs testlogs || true\n\nkubectl exec $POD_NAME -- /bin/sh -c \"\n    rm -rf /opt/harness/harness-core/testlogs || true\n\"\n\nif kubectl exec $POD_NAME -- test -d /addon/tmp/ti/v2/callgraph/cg; then\n    echo -e \"${GREEN}Call graph directory found in pod, copying...${NC}\"\n    mkdir -p /addon/tmp/ti/v2/callgraph/\n    kubectl cp $POD_NAME:/addon/tmp/ti/v2/callgraph/cg/ /addon/tmp/ti/v2/callgraph/cg/ || true\n    ls -la /addon/tmp/ti/v2/callgraph/cg/cg || echo -e \"${YELLOW}No call graph files found${NC}\"\nelse\n    echo -e \"${YELLOW}Call graph directory not found in pod, skipping copy.${NC}\"\n    mkdir -p /addon/tmp/ti/v2/callgraph/cg/cg\nfi\n\necho -e \"${YELLOW}Cleaning filter file and CG folder inside the pod${NC}\"\n\nkubectl exec $POD_NAME -- /bin/sh -c \"\n    rm -rf /addon/tmp/ti/v2/callgraph/cg/ || true\n    rm -rf /addon/tmp/ti/v2/filter/filter_0 || true\n\"\n\nif [ \"$TEST_EXIT_CODE\" != \"0\" ]; then\n    echo -e \"${RED}Tests failed with exit code $TEST_EXIT_CODE${NC}\"\n    exit $TEST_EXIT_CODE\nelse\n    echo -e \"${GREEN}Tests completed successfully or were skipped${NC}\"\n    exit 0\nfi"
                shell: sh
            - id: cleanup
              name: cleanup
              template:
                uses: org.warmedupcleanup_3909@1.1-arm
                with:
                    overlay:
                        step:
                            run:
                                container:
                                    connector: account.har_connector
                                    image: harness0.harness.io/oci/devx-images/ci-tools:v1.0.4
                                env:
                                    NAMESPACE: <+pipeline.variables.NAMESPACE>
                                    podName: <+steps.pre.output.outputVariables.podName>
                                    slackWH: <+pipeline.variables.Webhook>
                                    targetBranch: <+trigger.targetBranch>
            - id: testall
              name: checkIfTestAllRequired
              run:
                container:
                    connector: account.har_connector
                    image: harness0.harness.io/oci/devx-images/ci-tools:v1.0.4
                env:
                    FLAG: <+pipeline.stages.statefulRunner.steps.test.output.outputVariables.FLAG>
                    TI_FILTER_FILE_PATH: <+pipeline.stages.statefulRunner.steps.test.output.outputVariables.TI_FILTER_FILE_PATH>
                    TIALL: <+pipeline.stages.statefulRunner.steps.test.output.outputVariables.TIALL>
                output:
                    - alias: TIALL
                      name: TIALL
                script: |-
                    #!/bin/bash
                    # Check if filter file exists and is not empty

                    HC_TOKEN=<+stage.variables.HC_TOKEN>
                    COMMIT_SHA=<+pipeline.variables.SHA>
                    accountURL="harness0.harness.io"
                    accountIdentifier="l7B_kbSEQD2wjrM7PShm5w"
                    orgIdentifier="PROD"
                    projectIdentifier="Harness_Commons"



                    if [ "$TIALL" == "false" ] && [ "$FLAG" == "false" ]; then
                        echo "Skipping TIALL, tests were already executed by stateful bazel runners "

                        PR_TI=("TIAll-JavaUnitTests0" "TIAll-JavaUnitTests1" "TIAll-JavaUnitTests2" "TIAll-JavaUnitTests3"
                        "TIAll-JavaUnitTests4" "TIAll-JavaUnitTests5" "TIAll-JavaUnitTests6" "TIAll-JavaUnitTests7"
                        "TIAll-JavaUnitTests8" "TIAll-JavaUnitTests9" "TIAll-JavaUnitTests10" "TIAll-JavaUnitTests11"
                        "TIAll-JavaUnitTests12" "TIAll-JavaUnitTests13" "TIAll-JavaUnitTests14")

                        for check in "${PR_TI[@]}"; do
                        curl --silent --output /dev/null --location --request PUT 'https://'"$accountURL"'/gateway/code/api/v1/repos/harness-core/+/checks/commits/'"$COMMIT_SHA"'?accountIdentifier='"$accountIdentifier"'&orgIdentifier='"$orgIdentifier"'&projectIdentifier='"$projectIdentifier"'' \
                            --header 'Accept: application/vnd.github+json' \
                            --header 'X-Api-Key: '"$HC_TOKEN"'' \
                            --header 'Content-Type: application/json' \
                            --data '{
                                      "identifier": "'"${check}"'",
                                      "payload": {
                                          "data": {
                                              "details": "tests were already executed by stateful bazel runners"
                                          },
                                          "kind": "raw"
                                      },
                                      "status": "success",
                                      "summary": "tests were already executed by stateful bazel runners"
                                  }'
                        done
                    fi
                shell: bash
        - id: JavaUnitTestsParallel
          name: JavaUnitTestsParallel
          parallel:
            stages:
                - build-intelligence:
                    enabled: false
                  cache:
                    enabled: true
                    key: cache-{{ checksum "WORKSPACE" }}-arm
                    paths:
                        - /tmp/external
                        - /harness/bazel_dirs/repository_cache
                    policy: pull-push
                  clone:
                    enabled: true
                  env:
                    CI_ENABLE_BARE_METAL: <+stage.variables.CI_ENABLE_BARE_METAL>
                    GCP_CREDS_JSON: <+stage.variables.GCP_CREDS_JSON>
                    GCP_KEY_TEXT: <+stage.variables.GCP_KEY_TEXT>
                    HARNESS_GENERATION_PASSPHRASE: <+stage.variables.HARNESS_GENERATION_PASSPHRASE>
                    PLATFORM: <+stage.variables.PLATFORM>
                    SPLIT_STRATEGY: <+stage.variables.SPLIT_STRATEGY>
                    sa_token: <+stage.variables.sa_token>
                    tls_certificate: <+stage.variables.tls_certificate>
                    tls_client_certificate: <+stage.variables.tls_client_certificate>
                    tls_client_key: <+stage.variables.tls_client_key>
                  id: JavaUnitTests0
                  if: <+OnPipelineSuccess> && (<+pipeline.variables.COMMENT> =~ "trigger .*ut0.*" || <+pipeline.stages.statefulRunner.steps.testall.output.outputVariables.TIALL> == "true")
                  inputs:
                    CI_ENABLE_BARE_METAL:
                        type: string
                        value: "true"
                    GCP_CREDS_JSON:
                        mask: true
                        type: secret
                        value: gcpBazelCache
                    GCP_KEY_TEXT:
                        mask: true
                        type: secret
                        value: gcpBazelCache
                    HARNESS_GENERATION_PASSPHRASE:
                        mask: true
                        type: secret
                        value: harnessgenerationpassphrase
                    PLATFORM:
                        type: string
                        value: jenkins
                    SPLIT_STRATEGY:
                        description: denotes the splitting strategy for tests. old way(0) -> hash based splitting by hash(testName)%totalWorkers new way(1) -> time based splitting based on test suite times
                        type: number
                        value: 1
                    sa_token:
                        mask: true
                        type: secret
                        value: account.bot_harness_account_token
                    tls_certificate:
                        mask: true
                        type: secret
                        value: tls_certificate_text
                    tls_client_certificate:
                        mask: true
                        type: secret
                        value: tls_client_certificate_text
                    tls_client_key:
                        mask: true
                        type: secret
                        value: tls_client_key_text
                  name: JavaUnitTests0
                  platform:
                    arch: arm64
                    os: linux
                  runtime:
                    cloud:
                        size: large
                  shared-paths:
                    - /tmp
                  steps:
                    - id: pre
                      name: pre
                      run:
                        container:
                            connector: account.gcpgarsetup
                            image: us-west1-docker.pkg.dev/gar-setup/docker/harness/devx-platform:v3.1.0-arm
                            privileged: false
                        env:
                            BUILD_PURPOSE: PR_CHECK
                            DISTRIBUTE_TESTING_WORKER: "0"
                            DISTRIBUTE_TESTING_WORKERS: "15"
                            IGNORE_400_TESTS: "true"
                            IGNORE_LONG_RUNNING_TESTS: "1"
                            OPTIMIZED_PACKAGE_TESTS: "0"
                            hc_source: H0
                        output:
                            - alias: Master_0
                              name: Master_0
                            - alias: Master_1
                              name: Master_1
                            - alias: Master_2
                              name: Master_2
                            - alias: Master_3
                              name: Master_3
                            - alias: Master_4
                              name: Master_4
                        script: |-
                            export GOOGLE_CREDENTIALS_FILE=/tmp/gcp_creds.json
                            scripts/bazel/generate_credentials.sh

                            printenv
                            # export ti_token_encoded="$HARNESS_TI_SERVICE_TOKEN"
                            export X_Harness_Token=$(echo ${HARNESS_TI_SERVICE_TOKEN} | base64 --decode)
                            echo $X_Harness_Token
                            export TBRANCH=<+trigger.targetBranch>
                            export SBRANCH=<+trigger.sourceBranch>
                            if [ "$SPLIT_STRATEGY" = "1.0" ]; then
                              BASE_COMMIT_SHA=$(git merge-base origin/$TBRANCH origin/$SBRANCH)
                              export endtime=$(git show -s --format=%ct ${BASE_COMMIT_SHA})
                              endtime=$((endtime * 1000))
                              export starttime=$(($endtime - 7776000000))
                              chmod +x scripts/bazel/generateTestExecutionsDictionary.sh
                              sh scripts/bazel/generateTestExecutionsDictionary.sh
                              cat /harness/load_latest_test_execution_timings.bzl
                              source exports.sh
                              cat test-util.bzl
                            fi

                            touch .bazelignore
                            echo "200-functional-test" >> .bazelignore
                            echo "190-deployment-functional-tests" >> .bazelignore
                            echo "//product/..." >> .bazelignore
                            echo "//commons/..." >> .bazelignore
                            # echo "product" >> .bazelignore
                            # echo "commons" >> .bazelignore
                            cat .bazelignore
                        shell: bash
                      timeout: 10m
                    - id: runTestsWithIntelligence
                      name: runTestsWithIntelligence
                      run-test:
                        container:
                            connector: account.gcpgarsetup
                            image: us-west1-docker.pkg.dev/gar-setup/docker/harness/devx-platform:v3.1.0-arm
                            resources:
                                limits:
                                    cpu: 26000m
                                    memory: 75GiB
                        env:
                            BUILD_PURPOSE: PR_CHECK
                            DISTRIBUTE_TESTING_WORKER: "0"
                            DISTRIBUTE_TESTING_WORKERS: "15"
                            DOCKERHUB_PASSWORD: <+pipeline.variables.DOCKERHUB_PASSWORD>
                            DOCKERHUB_USERNAME: <+pipeline.variables.DOCKERHUB_USERNAME>
                            IGNORE_400_TESTS: "true"
                            IGNORE_LONG_RUNNING_TESTS: "1"
                            OPTIMIZED_PACKAGE_TESTS: "1"
                            OUTPUT_DIR: /harness/ut0/unit-test-reports
                        intelligence:
                            disabled: false
                        report:
                            paths:
                                - '*/target/surefire-reports/*.xml'
                                - testlogs/**/test.xml
                            type: junit
                        script: |
                            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

                            set -x
                            trap 'generateReport $?' ERR

                            printf "\nalwaysRunDetection: false\n" >> /tmp/engine/config.ini
                            cat /tmp/engine/config.ini

                            generateReport()
                            {
                                EXIT_CODE=$1
                                echo "EXIT CODE: $EXIT_CODE"
                                echo "error trap"
                                find `bazel --bazelrc=bazelrc.docker --output_base=/tmp info --repository_cache=/harness/bazel_dirs/repository_cache bazel-testlogs` -name test.xml | cpio -pmd testlogs
                                if [ $EXIT_CODE -eq 4 ]; then
                                    echo "4 - Build successful but no tests were found even though testing was requested."
                                    exit 0
                                fi
                                exit 1
                            }

                            export TMPDIR=/tmp/

                            export GOOGLE_CREDENTIALS_FILE=/tmp/gcp_creds.json
                            echo $GCP_CREDS_JSON | base64 -d > ${GOOGLE_CREDENTIALS_FILE}
                            echo $GCP_KEY_TEXT | base64 -d > /tmp/storage_secret.json

                            echo "200-functional-test" >> .bazelignore

                            # Pointing Cache to OVH Bazel Cache
                            #sed -i 's|https://storage.googleapis.com/harness-bazel-cache-us-central|https://harness-bazel-cache.qa.harness.io|g' bazelrc.docker
                            cat bazelrc.docker

                            # echo \\ >> bazelrc.docker
                            sed -i 's|--google_credentials=[^ ]*|--google_credentials=/tmp/gcp_creds.json|g' bazelrc.docker
                            cat bazelrc.docker

                            #cat /tmp/gcp_creds.json | docker login -u _json_key --password-stdin https://us.gcr.io

                            ls -lah /tmp

                            #Updating the maven_install json to OVH artifactory link
                            # if [ -f 'tools/bazel/repository.bzl' ]; then
                            # \tsed -i 's/harness-artifactory/harness-artifactory-ovh/g' tools/bazel/repository.bzl
                            # \tbazel run @unpinned_maven//:pin
                            # \tgrep -m 10 "harness-artifactory-ovh" project/main_maven_install.json
                            # fi

                            #bazel --bazelrc=bazelrc.docker build //...

                            bazel --bazelrc=bazelrc.docker --noworkspace_rc --output_base=/tmp test --repository_cache=/harness/bazel_dirs/repository_cache --remote_local_fallback --test_tag_filters=java_test --jobs=20 --remote_upload_local_results=true --show_timestamps --test_verbose_timeout_warnings --keep_going --discard_analysis_cache --notrack_incremental_state --nokeep_state_after_build --build_tests_only --remote_accept_cached --cache_test_results=yes --verbose_failures --test_env=IGNORE_400_TESTS=${IGNORE_400_TESTS} //...
                            sleep 10

                            find `bazel --bazelrc=bazelrc.docker --output_base=/tmp info --repository_cache=/harness/bazel_dirs/repository_cache bazel-testlogs` -name test.xml | cpio -pmd testlogs
                            find `bazel --bazelrc=bazelrc.docker --output_base=/tmp info --repository_cache=/harness/bazel_dirs/repository_cache output_base` -name heap.hprof | cpio -pmd memdumps

                            ls -lrta /harness
                            echo "INFO: PWD: $pwd"

                            OUTPUT_DIR="${OUTPUT_DIR}"
                            if [ -d "${OUTPUT_DIR}" ]; then
                                rm -rf ${OUTPUT_DIR}
                            fi
                            mkdir -p ${OUTPUT_DIR}

                            if [ -d 'testlogs' ]; then
                                tar -cvzf ${OUTPUT_DIR}/testlogs.tar.gz testlogs
                            fi

                            if [ -d 'memdumps' ]; then
                                tar -cvzf ${OUTPUT_DIR}/memdumps.tar.gz memdumps
                            fi

                            if [ -f "/tmp/server/jvm.out" ]; then
                                tar -cvzf ${OUTPUT_DIR}/jvmout.tar.gz /tmp/server/jvm.out
                            fi

                            # if [ -f "/tmp/execroot/harness_monorepo/bazel-out/k8-fastbuild/testlogs" ]; then

                            #     UNIT_TESTS_XML_PATH="/tmp/execroot/harness_monorepo/bazel-out/k8-fastbuild/testlogs"
                            #     TEST_CASE_REPORT="${OUTPUT_DIR}/TestCaseReport.xls"
                            #     TEST_CLASS_REPORT="${OUTPUT_DIR}/TestClassReport.xls"

                            #     curl https://harness-artifactory.harness.io/artifactory/BuildsTools/test_detail_analyser/TestDetailsAnalyzer.jar -o TestDetailsAnalyzer.jar

